# Copy this file to config.local.yaml for machine-specific, non-secret settings.
default_model: "gemini/gemini-2.5-flash"
architect_mode: false
architect_model: "gemini/gemini-2.5-pro"
language: "pt-BR"
yolo_mode: false
temperature: 0.2
max_tokens: 4096

local_endpoints:
  llamacpp: "http://localhost:8080"
  ollama: "http://localhost:11434"
  lmstudio: "http://localhost:1234/v1"
  vllm: "http://localhost:8000/v1"

git:
  auto_commit_on_edit: true
  commit_prefix: "llmCli:"

security:
  workspace_only: true
  command_timeout_seconds: 60

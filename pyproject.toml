[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmcli"
version = "0.1.0"
description = "AI Coding Assistant CLI supporting Local (llama.cpp, Ollama, LM Studio) and Cloud LLMs"
authors = [{ name = "llmCli Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.40",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
llm-cli = "src.main:cli_entrypoint"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

